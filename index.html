<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keya's Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg: #0d0c1d;
        --color-primary: #a855f7; /* Purple 500 */
        --color-secondary: #f472b6; /* Pink 400 */
        --color-accent: #60a5fa; /* Blue 400 */
        --color-text: #e5e7eb; /* Gray 200 */
        --color-text-dim: #9ca3af; /* Gray 400 */
        --color-border: rgba(255, 255, 255, 0.1);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text);
        background-attachment: fixed;
        transition: background-color 2s ease-in-out;
      }
      
      .font-title {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        letter-spacing: 0.1em;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-primary);
        border-radius: 4px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-secondary);
      }

      .glassmorphic-panel {
        background: radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.1), transparent 40%),
                    radial-gradient(circle at 0% 0%, rgba(244, 114, 182, 0.1), transparent 40%),
                    rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(12px) saturate(150%);
        -webkit-backdrop-filter: blur(12px) saturate(150%);
        border: 1px solid var(--color-border);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }
      
      .progress-bar {
        background-color: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255,255,255,0.1);
        padding: 2px;
      }
      .progress-bar-fill {
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.4), 0 0 5px rgba(255,255,255,0.3);
      }
      .health-bar { background: linear-gradient(to right, #4ade80, #16a34a); }
      .enemy-health-bar { background: linear-gradient(to right, #f87171, #dc2626); }
      .harmony-bar { background: linear-gradient(to right, #60a5fa, #2563eb); }
      
      @keyframes flash {
        50% { filter: brightness(3) drop-shadow(0 0 8px white); }
      }
      .animate-flash {
        animation: flash 0.2s ease-out;
      }
      
      @keyframes pop-in {
        0% { transform: scale(0.95); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in {
        animation: pop-in 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .animate-bob {
        animation: bob 3s ease-in-out infinite;
      }
      
      @keyframes room-transition {
          0% { opacity: 1; transform: scale(1); }
          50% { opacity: 0; transform: scale(0.98); }
          100% { opacity: 1; transform: scale(1); }
      }
      .animate-room-transition {
          animation: room-transition 0.3s ease-in-out forwards;
      }

      .ability-button {
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: bold;
        color: white;
        transition: all 0.2s ease-out;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        font-size: 0.875rem; /* text-sm */
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .ability-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background-color: #4B5563 !important; /* gray-600 */
        box-shadow: none;
      }
      .ability-button:not(:disabled):hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
        filter: brightness(1.1);
      }
      
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        background: rgba(0,0,0,0.5);
        border-radius: 5px;
        outline: none;
        transition: opacity .2s;
      }
      
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        background: var(--color-text);
        cursor: pointer;
        border-radius: 50%;
        border: 3px solid var(--color-primary);
        box-shadow: 0 0 5px var(--color-primary), 0 0 10px var(--color-primary);
        transition: background-color 0.2s;
      }
      input[type="range"]::-webkit-slider-thumb:hover {
        background-color: white;
      }

      input[type="range"]::-moz-range-thumb {
         width: 20px;
        height: 20px;
        background: var(--color-text);
        cursor: pointer;
        border-radius: 50%;
        border: 3px solid var(--color-primary);
        box-shadow: 0 0 5px var(--color-primary), 0 0 10px var(--color-primary);
      }

      #parallax-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
        background-color: var(--color-bg);
        transition: background-color 2s ease-in-out;
      }
      .parallax-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 200%;
        height: 200%;
        background-repeat: repeat;
        will-change: transform;
      }
      
      #bg-layer-1 { /* Distant stars */
        background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAwIiBoZWlnaHQ9IjEwMDAiPjxjaXJjbGUgY3g9IjEwMCIgY3k9IjEwMCIgcj0iMSIgZmlsbD0icmdiYSgyNTUsIDI1NSwgMjU1LCAwLjUpIi8+PGNpcmNsZSBjeD0iODAwIiBjeT0iMjAwIiByPSIwLjUiIGZpbGw9InJnYmEoMjU1LCAyNTUsIDI1NSwgMC4zKSIvPjxjaXJjbGUgY3g9IjQwMCIgY3k9IjcwMCIgcj0iMS4yIiBmaWxsPSJyZ2JhKDI1NSwgMjU1LCAyNTUsIDAuNykiLz48Y2lyY2xlIGN4PSI2MDAiIGN5PSI5MDAiIHI9IjEiIGZpbGw9InJnYmEoMjU1LCAyNTUsIDI1NSwgMC40KSIvPjwvc3ZnPg==');
        animation: move-background 180s linear infinite;
      }
      #bg-layer-2 { /* Nebula Cloud */
        background-image: radial-gradient(ellipse at 40% 60%, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
        animation: move-background 120s linear infinite reverse;
      }
       #bg-layer-3 { /* Closer Stars */
        background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MDAiIGhlaWdodD0iODAwIj48Y2lyY2xlIGN4PSIyMDAiIGN5PSIzMDAiIHI9IjIiIGZpbGw9InJnYmEoMjU1LCAyNTUsIDI1NSwgMC44KSIvPjxjaXJjbGUgY3g9IjcwMCIgY3k9IjUwMCIgcj0iMS41IiBmaWxsPSJyZ2JhKDI1NSwgMjU1LCAyNTUsIDAuNikiLz48Y2lyY2xlIGN4PSIxMDAiIGN5PSI3MDAiIHI9IjIuNSIgZmlsbD0icmdiYSgyNTUsIDI1NSwgMjU1LCAwLjkpIi8+PC9zdmc+');
        animation: move-background 60s linear infinite;
      }
      @keyframes move-background {
        from { transform: translate(0, 0); }
        to { transform: translate(-50%, -50%); }
      }
      .room-bg {
        position: absolute;
        inset: 0;
        z-index: -1;
        transition: background-image 0.5s ease-in-out, background-color 0.5s ease-in-out;
      }
      .room-frame {
        box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.6);
        background-image: linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
                          linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%),
                          linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.02) 75%),
                          linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.02) 75%);
        background-size: 30px 30px;
      }

      /* --- NEW ROOM BACKGROUNDS --- */
      @keyframes pulse { 50% { opacity: 0.1; } }
      @keyframes boss-room-anim { from { background-position: 0 0; } to { background-position: 60px 0; } }
      @keyframes glitch { 0% { transform: translate(0,0); } 25% { transform: translate(2px, -2px); } 50% { transform: translate(-2px, 2px); } 75% { transform: translate(2px, 2px); } 100% { transform: translate(0,0); } }

      .room-bg-encounter {
          background-image: 
              radial-gradient(circle, var(--color-secondary) 2px, transparent 2.5px),
              radial-gradient(circle, var(--color-accent) 1px, transparent 1.5px);
          background-size: 40px 40px, 40px 40px;
          background-position: 0 0, 20px 20px;
          opacity: 0.4;
          animation: pulse 2s infinite ease-in-out;
      }
      .room-bg-boss {
        background-image: 
            repeating-linear-gradient(45deg, var(--color-secondary), var(--color-secondary) 10px, transparent 10px, transparent 20px),
            repeating-linear-gradient(-45deg, var(--color-primary), var(--color-primary) 10px, transparent 10px, transparent 20px);
        background-size: 60px 60px;
        opacity: 0.3;
        animation: boss-room-anim 1s linear infinite;
      }
      /* Floor 1: Verdant Threshold */
      .room-bg-floor1 {
          --floor-color-1: #22c55e; /* green-500 */
          --floor-color-2: #84cc16; /* lime-500 */
          background-color: rgba(16, 185, 129, 0.05);
          background-image: 
              url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><path d="M 0 50 C 25 25, 75 75, 100 50" stroke="rgba(34, 197, 94, 0.2)" fill="none" stroke-width="2" stroke-linecap="round"/><path d="M 50 0 C 25 25, 75 75, 50 100" stroke="rgba(132, 204, 22, 0.15)" fill="none" stroke-width="2" stroke-linecap="round"/></svg>'),
              radial-gradient(circle at 25% 25%, var(--floor-color-1) 1px, transparent 2px),
              radial-gradient(circle at 75% 75%, var(--floor-color-2) 1px, transparent 2px);
          background-size: 100px 100px, 50px 50px, 50px 50px;
          opacity: 0.3;
      }
      /* Floor 2: Crystalline Halls */
      .room-bg-floor2 {
          --floor-color-1: #06b6d4; /* cyan-500 */
          background-color: rgba(6, 182, 212, 0.05);
          background-image:
              linear-gradient(135deg, var(--floor-color-1) 10%, transparent 10%),
              linear-gradient(225deg, var(--floor-color-1) 10%, transparent 10%),
              linear-gradient(45deg, var(--floor-color-1) 10%, transparent 10%),
              linear-gradient(315deg, var(--floor-color-1) 10%, transparent 10%);
          background-size: 80px 80px;
          opacity: 0.2;
      }
      /* Floor 3: Ashen Sanctum */
      .room-bg-floor3 {
          background-color: rgba(249, 115, 22, 0.05);
          background-image:
              url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><path d="M30 0 L35 25 L60 30 L35 35 L30 60 L25 35 L0 30 L25 25Z" fill="rgba(239, 68, 68, 0.2)"/><circle cx="30" cy="30" r="2" fill="rgba(249, 115, 22, 0.3)"/></svg>');
          background-size: 60px 60px;
          animation: pulse 4s infinite ease-in-out;
          opacity: 0.3;
      }
      /* Floor 4: Shadowed Deeps */
      .room-bg-floor4 {
          --floor-color-1: #8b5cf6; /* violet-500 */
          background-color: rgba(139, 92, 246, 0.05);
          background-image:
              radial-gradient(circle, var(--floor-color-1) 1px, transparent 1px),
              url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><path d="M 20 20 Q 40 60, 60 20" stroke="rgba(59, 130, 246, 0.2)" stroke-width="2" fill="none"/><path d="M 20 60 Q 40 20, 60 60" stroke="rgba(139, 92, 246, 0.25)" stroke-width="2" fill="none"/></svg>');
          background-size: 20px 20px, 80px 80px;
          opacity: 0.25;
      }
      /* Floor 5: Core Anomaly */
      .room-bg-floor5 {
          --floor-color-1: #dc2626; /* red-600 */
          --floor-color-2: #4f46e5; /* indigo-600 */
          background-color: rgba(220, 38, 38, 0.05);
          background-image:
              repeating-linear-gradient(0deg, transparent, transparent 4px, var(--floor-color-1) 5px),
              repeating-linear-gradient(90deg, transparent, transparent 4px, var(--floor-color-1) 5px),
              repeating-linear-gradient(45deg, var(--floor-color-2) 0, var(--floor-color-2) 1px, transparent 1px, transparent 10px);
          background-size: 50px 50px, 50px 50px, 10px 10px;
          animation: glitch 1.5s infinite steps(2, start);
          opacity: 0.3;
      }
      
      .spikes-bg {
          background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><path d="M0 20 L10 0 L20 20 Z" fill="rgba(239, 68, 68, 0.4)"/></svg>');
          background-size: 20px 20px;
          border-radius: 4px;
          border: 1px solid rgba(239, 68, 68, 0.6);
          box-shadow: inset 0 0 10px rgba(239, 68, 68, 0.5);
      }
      .pit-bg {
          background-color: #000;
          border-radius: 8px;
          border: 4px solid #1a1a1a;
          box-shadow: inset 0 0 20px 5px rgba(0,0,0,0.9);
      }
      .rock-bg {
          background-color: #4a4a4a;
          background-image: linear-gradient(335deg, #222 23px, transparent 23px),
                            linear-gradient(155deg, #222 23px, transparent 23px),
                            linear-gradient(335deg, #222 23px, transparent 23px),
                            linear-gradient(155deg, #222 23px, transparent 23px);
          background-size: 58px 58px;
          background-position: 0px 2px, 4px 35px, 29px 31px, 34px 6px;
          border: 2px solid #111;
          border-radius: 8px;
          box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
      }
      .wall-bg {
          background-color: #111;
          background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
          background-size: 15px 15px;
          border: 1px solid #2a2a2a;
          box-shadow: 3px 3px 8px rgba(0,0,0,0.5);
      }
      .cobweb-bg {
          background-image:
            radial-gradient(circle at top right, transparent 25%, rgba(230,230,250,0.2) 25.5%, rgba(230,230,250,0.2) 35.5%, transparent 36%),
            radial-gradient(circle at bottom left, transparent 25%, rgba(230,230,250,0.2) 25.5%, rgba(230,230,250,0.2) 35.5%, transparent 36%);
          background-size: 4em 4em;
          background-color: transparent;
          opacity: 0.5;
      }
      @keyframes hit-vfx {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.8; }
        100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
      }
      .animate-hit-vfx {
        animation: hit-vfx 0.4s ease-out forwards;
      }
      .screen-transition-container {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        height: 100%;
      }

      @keyframes fadeInWord {
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in-text {
        line-height: 1.7;
      }
      .fade-in-text > span {
        display: inline-block;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeInWord 0.4s forwards;
      }
      .fade-in-text > span:not(:empty) {
        margin-right: 0.25em;
      }
      .fade-in-text > span.highlighted {
        color: var(--color-primary);
        font-weight: bold;
      }

      @keyframes reward-glow {
        0% { box-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--color-primary), 0 0 20px var(--color-primary); }
        50% { box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px var(--color-secondary), 0 0 40px var(--color-secondary); }
        100% { box-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--color-primary), 0 0 20px var(--color-primary); }
      }
      
      @keyframes dodge-timer-countdown {
        from { width: 100%; }
        to { width: 0%; }
      }
      .dodge-timer-bar-animated {
        animation-name: dodge-timer-countdown;
        animation-timing-function: linear;
        animation-fill-mode: forwards;
      }

      @keyframes portal-swirl {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-portal-swirl {
        animation: portal-swirl 20s linear infinite;
      }

      @keyframes move-star {
        from { transform: translateY(0); }
        to { transform: translateY(-105vh); }
      }
      .star-anim {
        position: absolute;
        background-color: white;
        border-radius: 50%;
        animation: move-star linear infinite;
        will-change: transform;
        top: 105vh; /* Start from below the screen */
      }
      
      @keyframes float-up-fade {
        from { transform: translateY(0); opacity: 1; }
        to { transform: translateY(-30px); opacity: 0; }
      }
      .heal-vfx-text {
          position: absolute;
          color: #4ade80; /* green-400 */
          font-weight: bold;
          font-size: 1.25rem;
          text-shadow: 0 0 5px black;
          animation: float-up-fade 1.5s ease-out forwards;
          pointer-events: none;
          z-index: 100;
      }

      /* --- NEW VISUALS --- */
      @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .animate-hop { animation: hop 0.3s ease-out; }

      .wall-overlay {
          position: absolute;
          inset: 0;
          background-color: #111;
          background-image: linear-gradient(rgba(255,255,255,0.03) 2px, transparent 2px),
                            linear-gradient(90deg, rgba(255,255,255,0.03) 2px, transparent 2px);
          background-size: 40px 40px;
          z-index: 10;
          pointer-events: none;
          mask: url(#room-mask-square-normal);
          -webkit-mask: url(#room-mask-square-normal);
      }
      .wall-overlay-square-normal    { mask: url(#room-mask-square-normal); -webkit-mask: url(#room-mask-square-normal); }
      .wall-overlay-square-thick     { mask: url(#room-mask-square-thick); -webkit-mask: url(#room-mask-square-thick); }
      .wall-overlay-circle-normal    { mask: url(#room-mask-circle-normal); -webkit-mask: url(#room-mask-circle-normal); }
      .wall-overlay-circle-thick     { mask: url(#room-mask-circle-thick); -webkit-mask: url(#room-mask-circle-thick); }
      .wall-overlay-triangle-normal  { mask: url(#room-mask-triangle-normal); -webkit-mask: url(#room-mask-triangle-normal); }
      .wall-overlay-triangle-thick   { mask: url(#room-mask-triangle-thick); -webkit-mask: url(#room-mask-triangle-thick); }
      
      .fog-of-war {
        position: absolute;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.95);
        pointer-events: none;
        mask-image: radial-gradient(circle at var(--player-x, 50%) var(--player-y, 50%), transparent var(--sight-radius, 25%), black calc(var(--sight-radius, 25%) + 10%));
        -webkit-mask-image: radial-gradient(circle at var(--player-x, 50%) var(--player-y, 50%), transparent var(--sight-radius, 25%), black calc(var(--sight-radius, 25%) + 10%));
        transition: --sight-radius 0.5s ease-out, --player-x 0.05s linear, --player-y 0.05s linear;
        z-index: 5;
      }

      @keyframes fight-light-pulse {
        50% { background-size: 200% 200%; opacity: 0.6; }
      }
      .fight-light-effect {
        position: absolute;
        inset: -50%;
        background: radial-gradient(circle at center, rgba(255, 255, 255, 0.08), transparent 50%);
        animation: fight-light-pulse 6s infinite ease-in-out;
        z-index: 0;
      }
      
      @keyframes dodge-effect {
        0% { transform: translateX(0); opacity: 1; }
        25% { transform: translateX(-15px); opacity: 0.7; }
        75% { transform: translateX(15px); opacity: 0.7; }
        100% { transform: translateX(0); opacity: 1; }
      }
      .animate-dodge-effect { 
        animation: dodge-effect 0.3s ease-out; 
      }
      @keyframes resonant-wave-shadow-vfx {
        from {
            opacity: calc(0.6 * var(--vfx-opacity, 1));
            box-shadow: 0 0 0 0px rgba(96, 165, 250, 0.5);
        }
        to {
            opacity: 0;
            box-shadow: 0 0 0 500px rgba(96, 165, 250, 0);
        }
      }

      /* --- COMBAT VFX --- */
      @keyframes vfx-sunfire-anim {
        from { transform: scale(0); opacity: 1; }
        to { transform: scale(1.5); opacity: 0; }
      }
      .vfx-sunfire {
        position: absolute;
        top: 50%; left: 50%; width: 200%; height: 200%;
        transform-origin: center;
        background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,200,100,0.6) 40%, rgba(255,100,0,0) 70%);
        animation: vfx-sunfire-anim 0.6s ease-out forwards;
      }
      @keyframes vfx-celestial-strike-beam {
        0% { transform: translateY(-100%); opacity: 0.7; }
        50% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(0); opacity: 0; }
      }
      @keyframes vfx-celestial-strike-impact {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(1); opacity: 0; }
      }
      .vfx-celestial-strike-beam {
        position: absolute; top: 0; left: 50%; width: 10%; height: 100%;
        background: linear-gradient(to bottom, transparent 0%, #fffde7 50%, #fff176 100%);
        box-shadow: 0 0 20px 10px #fdd835;
        animation: vfx-celestial-strike-beam 0.4s cubic-bezier(0.6, 0.04, 0.98, 0.335) forwards;
      }
      .vfx-celestial-strike-impact {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle, white 20%, rgba(253,216,53,0.5) 60%, transparent 80%);
